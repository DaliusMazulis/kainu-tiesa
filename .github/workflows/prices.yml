name: Kainų kaupimas ir publikavimas
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: kainu-tiesa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -v
      - run: node --test test_core.mjs
      - run: node --check app.mjs
  collect:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public prices (no block circumvention)
        id: collect
        continue-on-error: true
        run: python collector.py --collect
      - name: Preserve observations and collection status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/observations.json data/observations.csv data/status.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: record daily public price observations'
            git push
          fi
      - name: Report a failed collection
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'No fresh prices collected. Previous history preserved; see data/status.json.'
          exit 1
  publish:
    if: always() && github.event_name != 'pull_request' && needs.verify.result == 'success'
    needs: [verify, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare public files only
        run: |
          mkdir -p _site/data
          cp index.html styles.css app.mjs core.mjs icon.svg _site/
          cp data/observations.json data/observations.csv data/status.json data/archive_offers.json _site/data/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - name: Wait for uploaded Pages artifact metadata
        env:
          PRICE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import json, os, time, urllib.request
          expected = f"github-pages-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          endpoint = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts?per_page=100"
          for attempt in range(10):
              request = urllib.request.Request(endpoint, headers={'Authorization': 'Bearer '+os.environ['PRICE_GITHUB_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=15) as response:
                  artifacts = json.load(response).get('artifacts', [])
              if any(a['name']==expected and not a.get('expired') for a in artifacts):
                  print('Pages artifact metadata is available.')
                  break
              time.sleep(3)
          else:
              raise SystemExit('Pages artifact metadata did not become available.')
          PYCODE
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
