<!doctype html><html lang="lt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kainų tiesa</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f3;color:#17382e;font:16px system-ui}header{background:#103d35;color:white;padding:24px}main{max-width:760px;margin:auto;padding:16px}section{background:white;border-radius:16px;padding:20px;margin-bottom:16px}input,button,select{font:inherit;padding:12px;border-radius:8px;border:1px solid #b8c8c1;width:100%;margin:6px 0}button{background:#103d35;color:white;cursor:pointer}label{display:block;margin-top:8px}small{color:#52675e}article{border-top:1px solid #ddd;padding:12px 0}h1{margin:0}output{display:block;padding:12px;font-weight:bold}</style><header><h1>KAINŲ TIESA</h1>Ne reklama. O faktai.</header><main><section><h2>Akcijos tikrintuvas</h2><small>Įveskite tos pačios prekės ir prekybos vietos kainas. Tai informacinis, ne teisinis vertinimas.</small><label>Skelbiama ankstesnė kaina (€)<input id="old" type="number" min=".01" step=".01"></label><label>Akcijos kaina (€)<input id="current" type="number" min="0" step=".01"></label><label>Mažiausia žinoma kaina per 30 dienų iki akcijos (€)<input id="minimum" type="number" min=".01" step=".01"></label><button id="check">Patikrinti</button><output id="result"></output></section><section><h2>Kainų registras</h2><small>Bandomoji versija: įrašai saugomi tik šiame įrenginyje. Automatinis rinkimas dar neprijungtas.</small><form id="form"><label>Prekė ir pakuotė / modelis<input id="product" required></label><label>Prekybos vieta ir kainos tipas<input id="store" required placeholder="Parduotuvė, miestas arba internetinė, kortelė / įprasta"></label><label>Kaina (€)<input id="price" type="number" min="0" step=".01" required></label><label>Data<input id="date" type="date" required></label><label>Šaltinis (nuoroda arba čekio nuoroda)<input id="source" required></label><button>Įrašyti kainą</button></form><input id="search" placeholder="Ieškoti prekės arba parduotuvės"><div id="history"></div><button id="export">Atsisiųsti kainų duomenis (JSON)</button></section></main><script>const $=id=>document.getElementById(id);let rows=JSON.parse(localStorage.getItem('kt-prices')||'[]');$('date').value=new Date().toLocaleDateString('sv-SE');const money=n=>n.toLocaleString('lt-LT',{style:'currency',currency:'EUR'});$('check').onclick=()=>{let a=Number($('old').value),b=Number($('current').value),c=Number($('minimum').value);if(!a||!c||!$('current').value||b<0||a<0||c<0){$('result').textContent='Įveskite tinkamas kainas.';return}$('result').textContent='Skelbiama nuolaida: '+((1-b/a)*100).toFixed(1)+' %. Pokytis pagal istoriją: '+((1-b/c)*100).toFixed(1)+' %. '+(b>=c?'Kaina nėra mažesnė už ankstesnę žinomą minimumo kainą.':'Sutaupymas pagal istoriją: '+money(c-b));};function render(){let q=$('search').value.toLowerCase();$('history').replaceChildren();for(let r of rows.filter(r=>(r.product+' '+r.store).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date))){let el=document.createElement('article');el.textContent=r.product+' · '+r.store+' · '+money(r.price)+' · '+r.date+' · Šaltinis: '+r.source;$('history').append(el)}if(!$('history').children.length)$('history').textContent='Įrašų nėra.'}$('form').onsubmit=e=>{e.preventDefault();rows.push({product:$('product').value.trim(),store:$('store').value.trim(),price:Number($('price').value),date:$('date').value,source:$('source').value.trim()});localStorage.setItem('kt-prices',JSON.stringify(rows));render()};$('search').oninput=render;$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(rows,null,2)],{type:'application/json'}));a.download='kainos.json';a.click();URL.revokeObjectURL(a.href)};render();</script></html>
